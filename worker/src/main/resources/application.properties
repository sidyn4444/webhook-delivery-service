#    webhook.hmac.secret=${HMAC_SECRET}       <- DONE (15b), see the outbound delivery section
#
#  And two that were planned here and deliberately went elsewhere:
#    webhook.retry.max-attempts     -> lives on the JOB instead (7b/12e). Captured at enqueue
#                                      time so a config change is not retroactive to messages
#                                      already queued under the old ceiling.
#    webhook.retry.initial-backoff  -> constants in RetryBackoff (12b). The schedule is a pure
#                                      function the tests assert exactly; making it configurable
#                                      would mean the tested schedule and the running one differ.
# =============================================================
