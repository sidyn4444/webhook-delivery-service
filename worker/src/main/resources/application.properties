# =============================================================
#  WORKER — application configuration
#
#  Rule for every line below:
#    literal      = same in every environment, and not secret
#    ${VAR}       = differs per environment, or is a secret
#    ${VAR:def}   = read VAR from the environment, fall back to 'def'
# =============================================================

# Distinguishes worker metrics from producer metrics in Grafana (Week 6).
spring.application.name=webhook-worker

# ---------------------------------------------------------------------------
# THE LINE THAT MAKES THIS A DAEMON.
# Tells Spring not to start a web server at all. The worker pulls jobs from a
# queue; nothing calls it over HTTP, so it needs no HTTP layer and no Tomcat.
#
# Together with depending on plain spring-boot-starter (not -web), this is the
# whole "background daemon, not a web service" distinction, in two decisions.
#
# Week 6 caveat, noted now so it isn't a surprise: Prometheus needs to scrape
# /actuator/prometheus on BOTH services, which requires an HTTP endpoint. Either
# re-enable a minimal management-only port here, or push metrics instead.
# ---------------------------------------------------------------------------
spring.main.web-application-type=none

# ---------------------------------------------------------------------------
# THE LINE THAT KEEPS THE PROCESS RUNNING.
#
# A JVM exits once its last NON-DAEMON thread finishes. The producer survives
# only because Tomcat holds one open; this app has nothing, so up to now it has
# started, run its startup work, and exited within a second (5f).
#
# keep-alive=true tells Spring Boot to start a non-daemon thread whose only job
# is to exist, so a non-web application stays up. Without it the worker cannot
# be a daemon at all — it would connect to Redis and immediately die.
#
# This is scaffolding with a known end date. In 9b the poll loop gets its own
# non-daemon thread and becomes the thing holding the JVM open; this line is
# then belt-and-braces rather than the load-bearing part. It stays because it
# makes "the process must not exit" an explicit statement rather than an
# accident of which thread happens to be running.
# ---------------------------------------------------------------------------
spring.main.keep-alive=true

# --- Redis: the job queue ---------------------------------------------------
# The same queue the producer writes to (8a/8c) — the producer LPUSHes here, the
# worker takes from the other end. These are separate copies of the same lines,
# not a shared file: application.properties is per-application and ships inside
# each JAR. What is actually shared is the ENVIRONMENT they read from, so one
# password change reaches both services.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# No default on purpose — a missing password must CRASH startup rather than
# silently connect to an unauthenticated Redis (notes 4h, 8a).
spring.data.redis.password=${REDIS_PASSWORD}

# ⚠️ DELIBERATELY DIFFERENT FROM THE PRODUCER'S 2s. Not an oversight.
#
# The producer only ever issues instant commands (LPUSH) from inside an HTTP
# request, so a slow Redis must fail fast instead of hanging a request thread.
#
# The worker's main command is a BLOCKING pop — it asks Redis for a job and
# deliberately waits up to 5s for one to appear rather than busy-polling (9b).
# This value is Lettuce's cap on how long ANY single command may take. Set it to
# 2s and every 5s blocking wait would be aborted by the client at 2s with a
# RedisCommandTimeoutException, roughly 12 times a minute, on a perfectly
# healthy system. The rule: command timeout must exceed the longest block.
spring.data.redis.timeout=10s

# Establishing a TCP connection is still expected to be fast — an unreachable
# Redis should surface in seconds, not hang. Only the blocking read is slow by
# design, so only that timeout is generous.
spring.data.redis.connect-timeout=2s

# --- Outbound delivery ------------------------------------------------------
# HARD ceiling on a single POST to a subscriber, covering DNS, TCP connect, TLS
# handshake, send and the wait for a reply.
#
# The failure it prevents: a subscriber that accepts the connection and then never
# answers. Without a cap that request waits forever, and the worker waits with it —
# delivering nothing else, ever. One badly-behaved (or malicious) subscriber URL
# would be enough to take out a whole worker pool, which is why the security
# requirements list this as mandatory rather than a tuning knob.
#
# 10s is the project's stated figure. It is generous for a webhook — a healthy
# subscriber answers in tens of milliseconds — and generosity is the right bias
# here: a timeout set too tight fails deliveries that would have succeeded, and
# each of those becomes a retry, then eventually a false dead-letter.
webhook.http.timeout=10s

# --- Postgres: the delivery attempt log -------------------------------------
# WORKER ONLY. The producer has no outcome to record and never connects here.
#
# A jdbc: URL is a connection string, not a web address: driver name, then host,
# port and database. The `postgresql` in the middle is how Java picks WHICH driver
# to hand the connection to.
#
# The default points at the docker-compose container so a fresh clone runs with no
# setup. In AWS (Week 5) POSTGRES_URL points at RDS in a private subnet.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/webhookdb}

# No defaults, on purpose — exactly the rule the Redis password follows above.
# A missing credential must crash startup rather than let the application come up
# and fail on the first write, hours later, on real traffic.
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ---------------------------------------------------------------------------
# WHO IS ALLOWED TO CHANGE THE SHAPE OF THE DATABASE.
#
# DDL = the SQL that alters structure (CREATE/ALTER/DROP TABLE) rather than data.
# Hibernate can see the whole table shape in the @Entity class, so it offers to
# manage the schema itself. The options:
#
#   none         do nothing — assume the table already exists
#   validate     compare the real table to the entity, CRASH if they disagree
#   update       silently ALTER the table to match the entity
#   create-drop  drop and recreate the table on every startup
#
# `update` is the tempting one and it is banned here. It only ever adds: rename a
# field and it adds the new column, leaves the old one orphaned holding the only
# copy of that data, and copies nothing across — with no script anywhere recording
# that it happened. It also makes the schema a side effect of whichever version of
# the app started most recently, which in Kubernetes means two versions of the app
# fighting over one table during a rolling update.
#
# 🔴 `validate` as of 10c, now that Flyway owns the schema.
#
# Hibernate is permanently demoted from "could manage the schema" to "checks the
# schema matches my entity, and refuses to start if it does not." It reads the real
# table, compares it to DeliveryAttempt.java, and fails context startup on any
# mismatch — a missing column, a wrong type, a nullability disagreement.
#
# What that buys: two independent definitions of the same table — the migration and
# the entity — now HAVE to agree, and disagreement is a boot failure rather than a
# wrong value discovered in production weeks later. The cost is that every schema
# change is two edits, and forgetting one stops the application. That is the correct
# direction to fail in.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate

# Open-Session-In-View keeps a database connection open for the whole duration of a
# web request so lazy-loaded fields still work in the view layer. It is enabled by
# default and Spring Boot warns about it on every startup.
#
# This application has no web layer at all, so the setting is inert here. It is set
# anyway for two reasons: it silences a warning that would otherwise train everyone
# to ignore startup warnings, and it states the position explicitly for the day a
# management port is added in Week 6 — at which point a default of `true` would
# start holding a pooled connection open across every scrape.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# CONNECTION POOL SIZE — a per-pod number that only makes sense multiplied.
#
# Opening a TCP connection to Postgres and authenticating takes milliseconds, which
# is enormous next to a query that takes microseconds. A pool opens connections once
# and lends them out, so the cost is paid at startup instead of per insert. HikariCP
# is the pool Spring Boot ships.
#
# The default is 10. This worker runs ONE poll loop on ONE thread (9b) and therefore
# uses exactly one connection at a time, so 10 would sit idle. That is harmless on a
# laptop and is not harmless later: Postgres allocates a backend process per
# connection and caps the total (RDS defaults are roughly 100), so the real number is
# pods × pool size. Thirty worker pods at the default would demand 300 connections
# and the cluster would start refusing them — a failure that appears only under the
# scale the system was built for, and looks nothing like a pool problem when it does.
#
# 5 rather than 1: leaves room for Session 3's recovery sweep and Week 6's metrics
# without a config change, while keeping the multiplication sane.
spring.datasource.hikari.maximum-pool-size=5

# How long a caller waits for a free connection before giving up. The default is 30s,
# which would park the poll loop for half a minute with no explanation when the
# database is unreachable. 5 seconds fails fast and loudly instead — the same
# reasoning as the 2s Redis connect timeout above.
#
# ⚠️ MILLISECONDS, NOT A DURATION. Writing `5s` here — the syntax that is correct two
# blocks up for spring.data.redis.timeout — fails startup outright:
#
#   Failed to bind properties under 'spring.datasource.hikari.connection-timeout'
#   to long: ... NumberFormatException: For input string: "5s"
#
# The rule behind the inconsistency: `spring.*` properties are bound to classes
# Spring owns, and Spring's binder understands Duration, so `5s`, `2000ms` and `1m`
# all work. Hikari properties are bound straight onto HikariConfig, a third-party
# class whose field is a plain `long` of milliseconds — there is no Duration type
# for the binder to convert into. The prefix looks Spring-shaped, the target is not.
spring.datasource.hikari.connection-timeout=5000

# --- Logging ----------------------------------------------------------------
logging.level.root=INFO

# --- Flyway: who owns the schema ---------------------------------------------
# Deliberately almost empty. Flyway is auto-configured the moment flyway-core is on
# the classpath, and its defaults are already what we want: read migrations from
# classpath:db/migration, run them in version order at startup, exactly once each,
# recording each run in a flyway_schema_history table it creates and maintains.
#
# Stated explicitly anyway, because "the schema is managed by migrations" is a
# project-wide rule and a reader should not have to infer it from a dependency.
spring.flyway.enabled=true

# ⚠️ Week 5 note, not needed locally: an EXISTING database that predates Flyway has
# no history table, so Flyway refuses to run rather than assume what state it is in.
# spring.flyway.baseline-on-migrate=true tells it to record the current state as the
# baseline and apply everything after it. Correct for adopting Flyway on a live
# database; wrong as a default, because it silently skips V1 on a database that
# should have had it.

