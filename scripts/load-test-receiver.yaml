# ---------------------------------------------------------------------------
#  The subscriber used for load and chaos testing. NOT part of the application.
#
#  🔴 WHY THIS EXISTS RATHER THAN POINTING AT httpbin.org.
#
#  The résumé claim is "sustained N deliveries/sec at p95 M ms". If the subscriber
#  is a public third-party endpoint then that p95 is mostly INTERNET LATENCY AND
#  SOMEONE ELSE'S SERVER, and the throughput ceiling is whatever rate limit they
#  apply -- measured earlier against httpbin.org: p95 373ms, of which almost none
#  was ours. Publishing that as this system's latency would be false.
#
#  An in-cluster receiver removes the internet, the third party and the rate limit,
#  so what remains is the producer, Redis, the worker pool and the network between
#  them -- which is the system the claim is about.
#
#  ⚠️ THE BOUNDARY, AND IT MUST BE STATED WHEREVER THE NUMBER IS: this measures
#  delivery to a subscriber ON THE SAME CLUSTER. A real subscriber is across the
#  internet and will be slower. The number is a measure of THIS SYSTEM'S capacity
#  to deliver, not of end-to-end latency a customer would see.
#
#  nginx `return 200` answers ANY method including POST, needs no application, and
#  uses ~10Mi -- so it cannot itself become the bottleneck at these rates.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadtest-receiver-conf
  namespace: webhooks
data:
  default.conf: |
    server {
      listen 8080;
      access_log off;              # writing a log line per request WOULD be a bottleneck
      location / {
        return 200 'ok';
        add_header Content-Type text/plain;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest-receiver
  namespace: webhooks
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadtest-receiver }
  template:
    metadata:
      labels: { app: loadtest-receiver }
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits:   { cpu: 500m, memory: 64Mi }
        readinessProbe:
          httpGet: { path: /, port: 8080 }
          initialDelaySeconds: 2
      volumes:
      - name: conf
        configMap: { name: loadtest-receiver-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: loadtest-receiver
  namespace: webhooks
spec:
  selector: { app: loadtest-receiver }
  ports:
  - port: 80
    targetPort: 8080
