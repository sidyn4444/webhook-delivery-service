# =============================================================
#  PRODUCER — application configuration
#
#  Rule for every line below:
#    literal      = same in every environment, and not secret
#    ${VAR}       = differs per environment, or is a secret
#    ${VAR:def}   = read VAR from the environment, fall back to 'def'
#
#  The same JAR runs on a laptop, in Kubernetes, and on AWS.
#  Only the environment changes — never this file.
# =============================================================

# Names this app in logs, metrics and Prometheus labels.
# Without it every service reports as "application" and dashboards are useless.
spring.application.name=webhook-producer

# The port embedded Tomcat binds. Explicit, because a K8s Service must target it.
server.port=8080

# --- Actuator ---------------------------------------------------------------
# Actuator exposes almost nothing by default. This opts in to exactly three
# endpoints. Never use '*' — that would expose heap dumps, environment
# variables and request mappings to anyone who can reach the pod.
management.endpoints.web.exposure.include=health,info,prometheus

# Splits /actuator/health into /health/liveness and /health/readiness, the two
# separate targets Kubernetes probes read in Week 4:
#   liveness  fails -> K8s restarts the pod
#   readiness fails -> K8s stops routing traffic to it (but leaves it running)
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# 🔴 THE ONE LINE ADDED AT 19d, AND IT CLOSES A MEASURED DEFECT.
#
# The line above creates the two probe groups — but Spring puts ONLY its own lifecycle
# flag in each. The `redis` health check lands in /actuator/health and in NEITHER group.
#
# Measured at 19b, with the Redis password removed:
#     /actuator/health            -> 503 DOWN     (correct)
#     /actuator/health/readiness  -> 200 UP       (wrong)
# while every POST /events returned 500.
#
# So the URL a Kubernetes readiness probe is documented to call reported a producer that
# could not reach its queue as ready for traffic — the exact failure readiness exists to
# prevent. Reading the config is not the same as reading the response.
#
# `redis` is named explicitly rather than "include everything", because the group is a
# deliberate list: THESE are the things without which this app is useless. The aggregate
# endpoint may legitimately report other things — diskSpace can trip while the app works
# perfectly — and those must not remove a working pod from service.
#
# ⚠️ Redis is NOT added to the liveness group, on purpose. Restarting this pod cannot
# start Redis; doing so would convert a brief Redis outage into a fleet-wide restart
# loop. The rule: liveness carries only what a restart could fix.
management.endpoint.health.group.readiness.include=readinessState,redis

# Health DETAILS can leak infrastructure hostnames. The up/down verdict is safe
# to expose publicly; the internals are not.
management.endpoint.health.show-details=when-authorized

# --- Redis: the job queue ---------------------------------------------------
# Where the queue lives. Local: the docker-compose container. AWS (Wk5): ElastiCache.
# The same JAR points at either one — only these environment values change.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# No default on purpose. A missing password must CRASH the app at startup rather
# than silently connecting to an unauthenticated Redis. Redis shipped open by
# default for years and it remains one of the most-exploited misconfigurations
# online (notes 4h). ${REDIS_PASSWORD} with no ':fallback' means "required".
spring.data.redis.password=${REDIS_PASSWORD}

# --- TLS to Redis (added 28b, for ElastiCache) -------------------------------
# 🔴 DEFAULTS TO false, AND THAT IS THE WHOLE DESIGN. ElastiCache was created with
# --transit-encryption-enabled, which is not optional there: the endpoint speaks
# TLS and nothing else. The local docker-compose Redis speaks plaintext and nothing
# else. Hardcoding `true` would fix AWS and break every local run, which means two
# images -- and then the thing that was tested is not the thing that shipped.
#
# So it is an environment value like REDIS_HOST, set to "true" only in k8s/eks/.
#
# ⚠️ THE SYMPTOM OF GETTING THIS WRONG IS NOT AN ERROR, IT IS A HANG -- measured at
# 27a: a plaintext client against a TLS-only endpoint sends bytes that are not a
# handshake, so the server waits for a handshake and the client waits for a reply
# and NEITHER SIDE HAS SEEN ANYTHING WRONG. It surfaces as a connection timeout,
# which points at the security group and the subnets long before it points here.
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Fail fast when Redis is unreachable instead of hanging a request thread.
# 2s to establish a connection, 2s cap on a single command. Without these the
# Lettuce defaults are generous, and a Redis outage would surface as slow
# requests piling up rather than a clean, fast error.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# --- Delivery policy --------------------------------------------------------
# The retry ceiling stamped onto every job at enqueue time. The retry logic that
# consumes it is Week 3; the value travels with the job from creation so a later
# config change can't retroactively re-judge jobs already on the queue.
webhook.delivery.max-retries=5

# --- Logging ----------------------------------------------------------------
# DEBUG everywhere buries real signal and costs money in log storage.
logging.level.root=INFO

