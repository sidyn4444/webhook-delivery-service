# =============================================================
#  PRODUCER — application configuration
#
#  Rule for every line below:
#    literal      = same in every environment, and not secret
#    ${VAR}       = differs per environment, or is a secret
#    ${VAR:def}   = read VAR from the environment, fall back to 'def'
#
#  The same JAR runs on a laptop, in Kubernetes, and on AWS.
#  Only the environment changes — never this file.
# =============================================================

# Names this app in logs, metrics and Prometheus labels.
# Without it every service reports as "application" and dashboards are useless.
spring.application.name=webhook-producer

# The port embedded Tomcat binds. Explicit, because a K8s Service must target it.
server.port=8080

# --- Actuator ---------------------------------------------------------------
# Actuator exposes almost nothing by default. This opts in to exactly three
# endpoints. Never use '*' — that would expose heap dumps, environment
# variables and request mappings to anyone who can reach the pod.
management.endpoints.web.exposure.include=health,info

# Splits /actuator/health into /health/liveness and /health/readiness, the two
# separate targets Kubernetes probes read in Week 4:
#   liveness  fails -> K8s restarts the pod
#   readiness fails -> K8s stops routing traffic to it (but leaves it running)
management.endpoint.health.probes.enabled=true

# Health DETAILS can leak infrastructure hostnames. The up/down verdict is safe
# to expose publicly; the internals are not.
management.endpoint.health.show-details=when-authorized

# --- Redis: the job queue ---------------------------------------------------
# Where the queue lives. Local: the docker-compose container. AWS (Wk5): ElastiCache.
# The same JAR points at either one — only these environment values change.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# No default on purpose. A missing password must CRASH the app at startup rather
# than silently connecting to an unauthenticated Redis. Redis shipped open by
# default for years and it remains one of the most-exploited misconfigurations
# online (notes 4h). ${REDIS_PASSWORD} with no ':fallback' means "required".
spring.data.redis.password=${REDIS_PASSWORD}

# Fail fast when Redis is unreachable instead of hanging a request thread.
# 2s to establish a connection, 2s cap on a single command. Without these the
# Lettuce defaults are generous, and a Redis outage would surface as slow
# requests piling up rather than a clean, fast error.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# --- Delivery policy --------------------------------------------------------
# The retry ceiling stamped onto every job at enqueue time. The retry logic that
# consumes it is Week 3; the value travels with the job from creation so a later
# config change can't retroactively re-judge jobs already on the queue.
webhook.delivery.max-retries=5

# --- Logging ----------------------------------------------------------------
# DEBUG everywhere buries real signal and costs money in log storage.
logging.level.root=INFO

# =============================================================
#  Week 3 adds:
#    webhook.hmac.secret=${HMAC_SECRET}   <- signing key for outbound webhooks
# =============================================================
