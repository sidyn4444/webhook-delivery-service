# =============================================================
#  PRODUCER — application configuration
#
#  Rule for every line below:
#    literal      = same in every environment, and not secret
#    ${VAR}       = differs per environment, or is a secret
#    ${VAR:def}   = read VAR from the environment, fall back to 'def'
#
#  The same JAR runs on a laptop, in Kubernetes, and on AWS.
#  Only the environment changes — never this file.
# =============================================================

# Names this app in logs, metrics and Prometheus labels.
# Without it every service reports as "application" and dashboards are useless.
spring.application.name=webhook-producer

# The port embedded Tomcat binds. Explicit, because a K8s Service must target it.
server.port=8080

# --- Actuator ---------------------------------------------------------------
# Actuator exposes almost nothing by default. This opts in to exactly three
# endpoints. Never use '*' — that would expose heap dumps, environment
# variables and request mappings to anyone who can reach the pod.
management.endpoints.web.exposure.include=health,info

# Splits /actuator/health into /health/liveness and /health/readiness, the two
# separate targets Kubernetes probes read in Week 4:
#   liveness  fails -> K8s restarts the pod
#   readiness fails -> K8s stops routing traffic to it (but leaves it running)
management.endpoint.health.probes.enabled=true

# Health DETAILS can leak infrastructure hostnames. The up/down verdict is safe
# to expose publicly; the internals are not.
management.endpoint.health.show-details=when-authorized

# --- Logging ----------------------------------------------------------------
# DEBUG everywhere buries real signal and costs money in log storage.
logging.level.root=INFO

